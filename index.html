<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="icon-32.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#241e19">
<title>CMV Salto das Nuvens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=DM+Sans:opsz,wght@9..40,400..800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Salto, versão "caderno de custos": paleta e letras da Carta, mas lateral clara (papel), dourado como cor de ação, blocos de número em terra e cantos levemente arredondados. */
:root{
  --bg:#f4ead8; --surface:#fff5e5; --ink:#382118; --muted:#5f4937; --line:#dcc8a6;
  --side:#fbf1df; --terra:#241e19; --terra-2:#35261d; --on-terra:#fff5e5;
  --accent:#a9442c; --accent-ink:#fff5e5; --accent-soft:#f3e2c9; --accent-text:#8c362a;
  --sand:#e6a43d; --sand-ink:#241e19; --gold-text:#e6a43d; --cell:#f8eedd;
  --good:#3d6b35; --good-soft:#e2ebd3; --warn:#8a5600; --warn-soft:#f8e2b8; --bad:#b3261e; --bad-soft:#f6d9d2;
  --font-display:"Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body:"DM Sans", "Segoe UI", system-ui, sans-serif;
  --font-num:"IBM Plex Mono", ui-monospace, monospace;
  --r:6px; color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#171714; --surface:#29241f; --ink:#f5e9d7; --muted:#d2bea3; --line:#45392e;
  --side:#211d19; --terra:#0f0d0b; --terra-2:#272420; --on-terra:#f5e9d7;
  --accent:#a3472c; --accent-ink:#f5e9d7; --accent-soft:#352b23; --accent-text:#f4b276;
  --sand:#efb24f; --sand-ink:#1b1815; --gold-text:#efb24f; --cell:#2f2924;
  --good:#9ccf86; --good-soft:#26331f; --warn:#efb24f; --warn-soft:#3a2d17; --bad:#ff8f7a; --bad-soft:#3d1d17; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#171714; --surface:#29241f; --ink:#f5e9d7; --muted:#d2bea3; --line:#45392e;
  --side:#211d19; --terra:#0f0d0b; --terra-2:#272420; --on-terra:#f5e9d7;
  --accent:#a3472c; --accent-ink:#f5e9d7; --accent-soft:#352b23; --accent-text:#f4b276;
  --sand:#efb24f; --sand-ink:#1b1815; --gold-text:#efb24f; --cell:#2f2924;
  --good:#9ccf86; --good-soft:#26331f; --warn:#efb24f; --warn-soft:#3a2d17; --bad:#ff8f7a; --bad-soft:#3d1d17; color-scheme:dark;}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--font-body)}
h1,h2,h3{font-family:var(--font-display);font-weight:800;text-transform:uppercase;text-wrap:balance;margin:0;line-height:.98}
h1{font-size:clamp(32px,3.6vw,46px)} h2{font-size:26px} h3{font-size:20px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sand);outline-offset:2px}
.num,td.n,th.n{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
td.n,.sum .row span:last-child{font-family:var(--font-num);font-size:13.5px}
.muted{color:var(--muted)} .small{font-size:13px}
.hidden{display:none!important}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-text)}
a{color:var(--accent-text);font-weight:700}
*{scrollbar-width:thin;scrollbar-color:var(--sand) transparent}
::-webkit-scrollbar{width:10px;height:10px} ::-webkit-scrollbar-thumb{background:var(--sand);border-radius:6px} ::-webkit-scrollbar-track{background:transparent}

/* login */
#login{min-height:100%;display:grid;place-items:center;padding:24px;background:var(--bg)}
.login-card{width:min(400px,100%);background:var(--surface);border:2px solid var(--terra);border-radius:10px;box-shadow:6px 6px 0 var(--sand);padding:0 0 26px;display:grid;gap:16px;overflow:hidden}
.login-card>*:not(.login-head){margin:0 26px}
.login-head{background:var(--terra);padding:22px 26px 18px;display:grid;gap:8px;border-bottom:5px solid var(--sand)}
.login-head img{width:100%;max-width:280px;height:auto;display:block}
.login-head .eyebrow{color:var(--gold-text)}
.login-card label{display:grid;gap:6px;font-weight:700;font-size:14px}
.err{color:var(--bad);font-size:14px;min-height:20px;font-weight:600}

/* shell: lateral clara */
#app{display:grid;grid-template-columns:240px minmax(0,1fr);height:100%}
nav,main{min-width:0}
nav{background:var(--side);border-right:2px solid var(--terra);display:flex;flex-direction:column;overflow:auto}
nav .brand{background:var(--terra);padding:18px 16px 14px;display:grid;gap:6px;border-bottom:5px solid var(--sand)}
nav .brand img{width:100%;max-width:196px;height:auto;display:block}
nav .brand .eyebrow{color:var(--gold-text);font-size:12px}
nav .links{padding:6px 10px;display:flex;flex-direction:column;gap:2px}
nav .sec{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-text);padding:14px 10px 4px}
nav button{all:unset;cursor:pointer;padding:8px 10px;font-weight:700;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:8px;border-radius:6px;color:var(--ink)}
nav button:hover{background:var(--accent-soft)}
nav button.on{background:var(--sand);color:var(--sand-ink);box-shadow:inset 4px 0 0 var(--accent)}
nav button:focus-visible{outline:3px solid var(--accent)}
nav .count{font-size:11px;font-family:var(--font-num);border:1px solid currentColor;border-radius:99px;padding:0 6px;opacity:.75}
nav .foot{margin-top:auto;padding:12px 16px 16px;border-top:1px dashed var(--line);font-size:13px;display:grid;gap:8px}
main{overflow:auto;padding:26px clamp(16px,3vw,40px) 60px}
.head{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:20px;padding-bottom:14px;border-bottom:2px dashed var(--line)}
.head p{margin:6px 0 0;color:var(--muted);max-width:70ch}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.btn{border:2px solid var(--terra);background:var(--surface);color:var(--ink);padding:7px 14px;border-radius:6px;cursor:pointer;font-weight:700;white-space:nowrap;min-height:38px}
:root[data-theme="dark"] .btn{border-color:var(--line)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn{border-color:var(--line)}}
.btn:hover{background:var(--accent-soft)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ai{border-color:var(--sand)}
.btn.ai.pri{background:var(--sand);color:var(--sand-ink);border-color:var(--sand);box-shadow:3px 3px 0 var(--terra)}
:root[data-theme="dark"] .btn.ai.pri{box-shadow:3px 3px 0 var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:2px 9px;font-size:13px;min-height:28px;border-width:1.5px}
.btn:disabled{opacity:.55;cursor:wait}
input.f,select.f,textarea.f{border:1.5px solid var(--line);background:var(--cell);padding:8px 10px;width:100%;min-width:0;border-radius:6px}
input.f:focus,select.f:focus,textarea.f:focus{border-color:var(--accent);outline:none;background:var(--surface)}
input.cell{border:1px solid transparent;background:transparent;padding:4px 6px;width:100%;text-align:right;font-variant-numeric:tabular-nums;border-radius:4px;font-family:var(--font-num);font-size:13.5px}
input.cell.l{text-align:left;font-family:var(--font-body);font-size:14px}
select.cell{border:1px solid var(--line);background:var(--surface);padding:3px 4px;text-align:left;border-radius:4px}
input.cell:hover{border-color:var(--line)} input.cell:focus{border-color:var(--accent);background:var(--surface);outline:none}
.search{max-width:280px}

.card{background:var(--surface);border:1.5px solid var(--line);border-top:5px solid var(--sand);border-radius:var(--r);padding:18px}
.card h3{color:var(--accent-text)}
.grid{display:grid;gap:14px;align-content:start}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:12px;margin-bottom:22px}
.kpi{background:var(--terra);color:var(--on-terra);border-radius:var(--r);padding:13px 15px;border-bottom:4px solid var(--sand)}
.kpi .v{font-family:var(--font-num);font-size:23px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.15;margin-top:4px;color:var(--gold-text)}
.kpi .l{font-size:11.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.kpi .s{font-size:12px;opacity:.75}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:18px}

.tablewrap{overflow-x:auto;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r)}
.card .tablewrap{border:0}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:800;text-align:left;padding:10px;border-bottom:2px solid var(--terra);background:var(--surface);position:sticky;top:0;white-space:nowrap}
:root[data-theme="dark"] th{border-bottom-color:var(--line)}
th.sort{cursor:pointer} th.sort:hover{color:var(--accent-text)}
td{padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:nth-child(even){background:var(--cell)}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--accent-soft)}
tr.click{cursor:pointer}
tr.hl td{background:color-mix(in srgb,var(--sand) 35%,transparent)}
tfoot td{font-weight:800;border-top:2px solid var(--terra)}

.pill{display:inline-block;padding:1px 8px;border-radius:4px;font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.n{background:var(--accent-soft);color:var(--accent-text);font-family:var(--font-num);text-transform:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:3px 12px;font-size:13px;font-weight:700;cursor:pointer}
.chip.on{background:var(--terra);color:var(--on-terra);border-color:var(--terra)}

/* ficha editor */
.fgrid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px;align-items:start}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.form label{display:grid;gap:4px;font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.form label.wide{grid-column:1/-1}
.sum{position:sticky;top:0;display:grid;gap:2px;background:var(--terra);color:var(--on-terra);border-color:var(--terra);border-top-color:var(--sand)}
.sum h3{color:var(--gold-text)}
.sum .row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed rgba(255,245,229,.18);font-variant-numeric:tabular-nums}
.sum .row.big{font-size:21px;font-weight:800;font-family:var(--font-display);text-transform:uppercase}
.sum .row.big span:last-child{font-size:16px}
.sum .muted{color:rgba(255,245,229,.72)}
.sum .btn{background:transparent;color:var(--on-terra);border-color:var(--sand)}
.sum .btn:hover{background:var(--terra-2)}
.bar{height:10px;border-radius:3px;background:rgba(255,255,255,.15);overflow:hidden;display:flex;margin:10px 0 4px}
.bar span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;opacity:.85}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(27,24,21,.55);display:grid;place-items:center;padding:16px;z-index:20}
.modal{background:var(--surface);border:2px solid var(--terra);border-top:6px solid var(--sand);border-radius:10px;box-shadow:0 20px 50px rgba(0,0,0,.3);width:min(640px,100%);max-height:calc(100% - 32px);overflow:auto;padding:22px;display:grid;gap:14px}
.modal.wide{width:min(1000px,100%)}
.modal .actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.modal .kpi{border-radius:6px}
.sugg{border:1.5px solid var(--sand);border-radius:8px;padding:12px;background:color-mix(in srgb,var(--sand) 12%,var(--surface));display:grid;gap:6px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--terra);color:var(--on-terra);border-left:5px solid var(--sand);border-radius:6px;padding:10px 16px;z-index:30;font-size:14px;font-weight:600;max-width:90vw;display:flex;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.status{display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good)}
.dot.busy{background:var(--sand)} .dot.off{background:var(--bad)}

.mtop,.mbar,.msum{display:none}
@media (max-width:760px){
  #app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr}
  nav{display:none}
  .mtop{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--terra);color:var(--on-terra);padding:calc(10px + env(safe-area-inset-top)) 16px 9px;border-bottom:4px solid var(--sand)}
  .mtop img{height:24px;width:auto;display:block}
  .mtop .status{font-size:12px;opacity:.9}
  main{padding:16px 14px calc(96px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
  .mbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;background:var(--terra);border-top:3px solid var(--sand);padding-bottom:env(safe-area-inset-bottom);z-index:15}
  .mbar button{all:unset;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:60px;color:var(--on-terra);font-size:11px;font-weight:700;opacity:.75;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .mbar button svg{width:23px;height:23px}
  .mbar button.on{opacity:1;color:var(--gold-text)}
  .mbar button:focus-visible{outline:3px solid var(--sand);outline-offset:-3px}
  .msum{position:fixed;left:10px;right:10px;bottom:calc(70px + env(safe-area-inset-bottom));z-index:14;background:var(--sand);color:var(--sand-ink);border-radius:10px;padding:8px 12px;box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:13px;font-weight:700;align-items:center;justify-content:space-between;gap:10px;cursor:pointer}
  .msum.on{display:flex}
  .msum b{font-family:var(--font-num);font-size:15px}
  .msum span{display:grid;line-height:1.2}
  .msum small{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;opacity:.75}
  body.com-msum main{padding-bottom:calc(150px + env(safe-area-inset-bottom))}
  h1{font-size:30px} h2{font-size:23px} h3{font-size:18px}
  .head{margin-bottom:14px;padding-bottom:10px;gap:10px}
  .head>div:first-child{width:100%}
  .head p{font-size:14px}
  .tools{width:100%;gap:8px}
  .tools .search,.tools input.f{max-width:none!important;width:100%!important;flex:1 1 100%}
  .tools .btn,.tools label.btn{flex:1 1 auto;text-align:center;justify-content:center;display:inline-flex;align-items:center}
  .tools label.small{flex:1 1 auto}
  .btn{min-height:44px}
  .btn.sm{min-height:36px;padding:4px 12px}
  input.f,select.f,textarea.f,input.cell,select.cell{font-size:16px}
  input.cell{padding:7px 8px;border-color:var(--line);background:var(--surface)}
  select.cell{padding:7px 6px}
  .kpis{grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
  .kpi{padding:10px 12px}
  .kpi .v{font-size:19px}
  .kpi .l{font-size:10.5px}
  .two{grid-template-columns:minmax(0,1fr);gap:14px}
  .card{padding:14px}
  .chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;margin-right:-14px}
  .chip{flex:none;padding:7px 12px}
  .form{grid-template-columns:1fr 1fr;gap:10px}
  .fgrid{grid-template-columns:minmax(0,1fr);gap:14px}
  .sum{position:static}
  .tablewrap{overflow:visible}
  /* tabelas viram cartões */
  table.rt thead{display:none}
  table.rt,table.rt tbody,table.rt tfoot,table.rt tr,table.rt td{display:block;width:100%}
  table.rt tr{padding:10px 12px;border-bottom:1px solid var(--line)}
  table.rt tbody tr:nth-child(even){background:transparent}
  table.rt tbody tr:hover{background:transparent}
  table.rt tr:last-child{border-bottom:0}
  table.rt td{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:3px 0;border:0;text-align:right;white-space:normal;min-height:30px}
  table.rt td::before{content:attr(data-l);font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;flex:none;max-width:45%}
  table.rt td.tt{display:block;text-align:left;font-weight:700;font-size:15.5px;padding-bottom:4px}
  table.rt td.tt::before,table.rt td.na::before,table.rt td[colspan]::before{content:none}
  table.rt td.na{justify-content:flex-end;gap:8px;padding-top:6px}
  table.rt td.hm{display:none}
  table.rt td[colspan]{display:block;text-align:left}
  table.rt td{width:auto!important}
  table.rt td input.cell,table.rt td select.cell{width:58%;max-width:58%;flex:0 0 58%}
  table.rt td.tt input.cell{max-width:none;width:100%;font-weight:700}
  table.rt td:empty{display:none}
  table.rt tr.hl{background:color-mix(in srgb,var(--sand) 30%,transparent)}
  table.rt tfoot tr{background:var(--cell)}
  /* janelas de baixo para cima */
  .modal-bg{padding:0;align-items:end}
  .modal{width:100%!important;max-height:92%;border-radius:16px 16px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));border-width:2px 0 0}
  .modal .actions{position:sticky;bottom:calc(-20px - env(safe-area-inset-bottom));background:var(--surface);padding:10px 0 4px;margin-bottom:-4px}
  .modal .actions .btn{flex:1 1 auto}
  .toast{bottom:calc(80px + env(safe-area-inset-bottom));width:calc(100% - 28px);justify-content:space-between}
  .mais{display:grid;gap:6px}
  .mais button{all:unset;display:flex;justify-content:space-between;align-items:center;padding:13px 14px;border:1.5px solid var(--line);border-radius:8px;font-weight:700;cursor:pointer}
  .mais button.on{background:var(--sand);color:var(--sand-ink);border-color:var(--sand)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<section id="login">
  <form class="login-card" id="loginForm" autocomplete="on">
    <div class="login-head"><img src="logo.png" alt="Salto das Nuvens" width="280" height="42"><span class="eyebrow">Custos &amp; fichas técnicas</span></div>
    <h2>Entrar</h2>
    <input type="hidden" id="lu" name="username" autocomplete="username" value="saltodasnuvens">
    <label for="lp">Senha<input class="f" id="lp" name="password" type="password" autocomplete="current-password" required></label>
    <div class="err" id="lerr" role="alert"></div>
    <button class="btn pri" type="submit">Entrar</button>
  </form>
</section>

<div id="app" class="hidden">
  <header class="mtop" id="mtop"></header>
  <nav id="nav" aria-label="Módulos"></nav>
  <main id="main" tabindex="-1"></main>
  <div class="msum" id="msum" role="button" tabindex="0" aria-label="Ver resumo de custos"></div>
  <div class="mbar" id="mbar" role="navigation" aria-label="Módulos principais"></div>
</div>
<div id="modalRoot"></div>

<script>
"use strict";
/* ================= utilidades ================= */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const BRL=new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"});
const brl=v=>isFinite(v)?BRL.format(v):"–";
const pct=(v,d=1)=>isFinite(v)?(v*100).toLocaleString("pt-BR",{minimumFractionDigits:d,maximumFractionDigits:d})+"%":"–";
const nf=(v,d=3)=>isFinite(v)?Number(v).toLocaleString("pt-BR",{minimumFractionDigits:0,maximumFractionDigits:d}):"–";
const pnum=s=>{if(typeof s==="number")return s;s=String(s??"").trim().replace(/\s/g,"");if(!s)return 0;if(s.includes(",")){s=s.replace(/\./g,"").replace(",",".")}const v=parseFloat(s);return isFinite(v)?v:0};

/* ================= motor de cálculo ================= */
const BASE={kg:"kg",g:"kg",l:"l",ml:"l",un:"un"};
const toBase=(q,u)=>(u==="g"||u==="ml")?q/1000:q;
function insById(id){return S.insumos.find(i=>i.id===Number(id))}
function fichaByCod(c){return S.fichas.find(f=>f.cod===c)}
function unitsFor(ref){
  if(typeof ref==="string")return["kg","g","porções"];
  const i=insById(ref);if(!i)return["kg","g","l","ml","un"];
  return i.un==="kg"?["kg","g"]:i.un==="l"?["l","ml"]:["un"];
}
function precoUnit(i){return i&&i.qtd>0?i.preco/i.qtd:0}            // R$ por kg/l/un
function precoComFC(i){return precoUnit(i)*(i.fc||1)}
function cfgCalc(){
  const c=S.cfg;
  const fixos=(c.custosFixos||[]).reduce((a,b)=>a+(+b.valor||0),0);
  const fats=(c.faturamento||[]).filter(v=>v>0);
  const fatMedia=fats.length?fats.reduce((a,b)=>a+b,0)/fats.length:0;
  const pFix=fatMedia?fixos/fatMedia:0;
  const pVarR=(c.varRef||[]).reduce((a,b)=>a+(+b.valor||0),0)/100;
  const pVarB=(c.varBeb||[]).reduce((a,b)=>a+(+b.valor||0),0)/100;
  const L=+c.lucroDesejado||0;
  const mkA=1-(pFix+pVarR+L)>0?1/(1-(pFix+pVarR+L)):NaN;
  const mkB=1-(pFix+pVarB+L)>0?1/(1-(pFix+pVarB+L)):NaN;
  return{fixos,fatMedia,fatTotal:(c.faturamento||[]).reduce((a,b)=>a+(+b||0),0),pFix,pVarR,pVarB,L,mkA,mkB,custoMax:1-(L+pFix+pVarR)};
}
let memo=null;
function resetMemo(){memo=new Map()}
function linha(it,stack){
  // retorna {nome, bruta (base), un, pu (R$/base), custo, ok}
  if(typeof it.ref==="string"){
    const f=fichaByCod(it.ref);
    if(!f)return{nome:"Ficha "+it.ref+" não encontrada",bruta:0,un:"kg",pu:0,custo:0,ok:false};
    if(stack.includes(f.cod))return{nome:f.nome+" (referência circular)",bruta:0,un:"kg",pu:0,custo:0,ok:false};
    const r=calcFicha(f,stack);
    const kg=it.un==="porções"?it.qtd*(f.rend/(f.porcoes||1)):toBase(it.qtd,it.un);
    const pu=f.rend?r.custoReceita/f.rend:0;
    return{nome:f.nome,bruta:kg,un:"kg",pu,custo:kg*pu,ok:true,sub:true};
  }
  const i=insById(it.ref);
  if(!i)return{nome:"Insumo "+it.ref+" não encontrado",bruta:0,un:"",pu:0,custo:0,ok:false};
  const bruta=toBase(it.qtd,it.un)*(i.fc||1);
  const pu=precoUnit(i);
  return{nome:i.nome,bruta,un:i.un,pu,custo:bruta*pu,ok:true,fc:i.fc||1};
}
function calcFicha(f,stack=[]){
  if(!memo)resetMemo();
  if(memo.has(f.cod))return memo.get(f.cod);
  const st=[...stack,f.cod];
  const linhas=f.itens.map(it=>linha(it,st));
  const custo=linhas.reduce((a,b)=>a+b.custo,0);
  const custoReceita=custo*(1+(+f.perdas||0)/100);
  const k=cfgCalc();
  const preco=+f.preco||0;
  const fixos=preco*k.pFix, varr=preco*k.pVarR;
  const lucro=preco-(custoReceita+fixos+varr);
  const r={linhas,custo,custoReceita,porcao:custoReceita/(f.porcoes||1),kg:f.rend?custoReceita/f.rend:0,
    preco,fixos,varr,lucro,pLucro:preco?lucro/preco:NaN,pCusto:preco?custoReceita/preco:NaN,
    margem:preco?preco-(custoReceita+varr):NaN,pMargem:preco?(preco-(custoReceita+varr))/preco:NaN,
    sugerido:custoReceita*k.mkA};
  memo.set(f.cod,r);return r;
}
function usosInsumo(id){return S.fichas.filter(f=>f.itens.some(it=>it.ref===id))}
function usosFicha(cod){return S.fichas.filter(f=>f.itens.some(it=>it.ref===cod))}
function medias(){
  resetMemo();
  const com=S.fichas.filter(f=>+f.preco>0).map(f=>calcFicha(f));
  const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:NaN;
  return{n:com.length,lucro:avg(com.map(r=>r.pLucro)),margem:avg(com.map(r=>r.pMargem)),custo:avg(com.map(r=>r.pCusto))};
}
function statusFicha(r){
  const k=cfgCalc();
  if(!r.preco)return'<span class="pill n">Sem preço</span>';
  if(r.pLucro<0)return'<span class="pill bad">Prejuízo</span>';
  if(r.pLucro<k.L)return'<span class="pill warn">Abaixo da meta</span>';
  return'<span class="pill good">Na meta</span>';
}
/* explosão de ingredientes para produção */
function explodir(f,kgNecessario,acc){
  if(!f.rend)return;
  const fator=kgNecessario/f.rend;
  for(const it of f.itens){
    if(typeof it.ref==="string"){
      const sub=fichaByCod(it.ref);if(!sub)continue;
      const kg=it.un==="porções"?it.qtd*(sub.rend/(sub.porcoes||1)):toBase(it.qtd,it.un);
      explodir(sub,kg*fator,acc);
    }else{
      const i=insById(it.ref);if(!i)continue;
      const q=toBase(it.qtd,it.un)*(i.fc||1)*fator;
      const a=acc.get(i.id)||{i,q:0,de:new Set()};a.q+=q;a.de.add(f.nome);acc.set(i.id,a);
    }
  }
}

  const bg=root.firstElementChild;

  const onKey=e=>{if(e.key==="Escape")close()};
  document.addEventListener("keydown",onKey);
  bg.addEventListener("mousedown",e=>{if(e.target===bg)close()});
  bg.querySelectorAll("[data-close]").forEach(b=>b.onclick=close);
  const m=bg.firstElementChild;
  onMount&&onMount(m,close);
  const first=m.querySelector("input,select,textarea,button");first&&first.focus();
  return close;
}

      <td class="small">${s&&!s.erro?`${brl(s.faixa_min)} a ${brl(s.faixa_max)} · ${esc(s.confianca||"")}`:""}</td>

  };

  let feitos=0;

  }

    });
    if(n){save("insumos");toast(`${n} preço(s) atualizado(s).`)}
    $("#modalRoot").innerHTML="";render();
  };
}

        <input class="f" list="refs" id="newref" placeholder="Adicionar ingrediente…" style="max-width:360px" aria-label="Adicionar ingrediente">
        <button class="btn pri" id="addIng">Adicionar</button>
        <button class="btn ai" id="newIns">Cadastrar insumo novo (com sugestão de preço)</button>
      </div>
    </div>
   </div>
   <div class="card sum" id="sum"></div>
  </div>`;
  const ing=$("#ing",el);
  const drawIng=()=>{
    resetMemo();const r=calcFicha(f);
    ing.innerHTML=f.itens.map((it,ix)=>{const l=r.linhas[ix];const us=unitsFor(it.ref);
      const nome=typeof it.ref==="string"?`<span class="pill n">${it.ref}</span> ${esc(l.nome)}`:esc(l.nome);
      return`<tr data-ix="${ix}"><td style="min-width:220px">${l.ok?nome:`<span style="color:var(--bad)">${esc(l.nome)}</span>`}</td>
      <td class="n" style="width:100px"><input class="cell" data-k="qtd" value="${nf(it.qtd,4)}" aria-label="Quantidade"></td>
      <td><select class="cell l" data-k="un" aria-label="Unidade">${(us.includes(it.un)?us:[it.un,...us]).map(u=>`<option ${u===it.un?"selected":""}>${u}</option>`).join("")}</select></td>
      <td class="n">${l.sub?"–":nf(l.fc,3)}</td><td class="n">${nf(l.bruta,4)} ${l.un}</td><td class="n">${brl(l.pu)}</td><td class="n"><b>${brl(l.custo)}</b></td>
      <td class="n small muted">${r.custo?pct(l.custo/r.custo,0):""}</td>
      <td style="white-space:nowrap">${typeof it.ref==="number"?`<button class="btn sm" data-a="ins" title="Editar insumo">R$</button> `:`<button class="btn sm" data-a="sub" title="Abrir sub-receita">Abrir</button> `}<button class="btn sm danger" data-a="rm" aria-label="Remover">✕</button></td></tr>`}).join("")||`<tr><td colspan="9" class="muted">Nenhum ingrediente ainda.</td></tr>`;
    $("#tot",el).textContent=brl(r.custo);
    drawSum(r);
  };
  const drawSum=r=>{
    const p=r.preco;
    const seg=p?[[r.custoReceita/p,"#d2603f","CMV"],[r.fixos/p,"#bba995","Fixos"],[r.varr/p,"#e6a43d","Variáveis"],[Math.max(0,r.lucro)/p,"#8fc77a","Lucro"]]:[];
    $("#sum",el).innerHTML=`<h3>Custos e preço</h3>
     <div class="row"><span>Ingredientes</span><span>${brl(r.custo)}</span></div>
     <div class="row"><span>+ Perdas (${nf(f.perdas,2)}%)</span><span>${brl(r.custoReceita-r.custo)}</span></div>
     <div class="row big"><span>Custo da receita</span><span>${brl(r.custoReceita)}</span></div>
     <div class="row"><span>Custo por porção</span><span>${brl(r.porcao)}</span></div>
     <div class="row"><span>Custo por kg</span><span>${brl(r.kg)}</span></div>
     <div class="row"><span>Preço sugerido (markup ${nf(k.mkA,2)}×)</span><span><b>${brl(r.sugerido)}</b></span></div>
     ${p?`<div class="row"><span>Custos fixos (${pct(k.pFix)})</span><span>${brl(r.fixos)}</span></div>
     <div class="row"><span>Custos variáveis (${pct(k.pVarR,2)})</span><span>${brl(r.varr)}</span></div>
     <div class="row big"><span>Lucro</span><span style="color:${r.lucro<0?"#ff9a8a":"#a6dc8f"}">${brl(r.lucro)} · ${pct(r.pLucro)}</span></div>
     <div class="row"><span>% custo (CMV)</span><span>${pct(r.pCusto)}</span></div>
     <div class="row"><span>Margem de contribuição</span><span>${brl(r.margem)} · ${pct(r.pMargem)}</span></div>
     <div class="bar" aria-hidden="true">${seg.map(s=>`<span style="width:${Math.max(0,s[0]*100)}%;background:${s[1]}"></span>`).join("")}</div>
     <div class="legend">${seg.map(s=>`<span><i style="background:${s[1]}"></i>${s[2]} ${pct(s[0],0)}</span>`).join("")}</div>
     <div style="margin-top:6px">${statusFicha(r)}</div>`:`<p class="small muted">Sem preço de venda: tratada como preparação base (sub-receita).</p>`}
     <div style="display:grid;gap:6px;margin-top:8px">
     ${r.sugerido&&Math.abs((f.preco||0)-Math.ceil(r.sugerido*10)/10)>0.001?`<button class="btn sm" id="useSug">Usar preço sugerido (${brl(Math.ceil(r.sugerido*10)/10)})</button>`:""}
     ${f.precoAnterior!=null?`<button class="btn sm" id="undoSug">Desfazer: voltar para ${f.precoAnterior?brl(f.precoAnterior):"sem preço"}</button>`:""}
     </div>
     ${usosFicha(f.cod).length?`<p class="small muted">Usada em: ${usosFicha(f.cod).map(x=>esc(x.nome)).join(", ")}</p>`:""}`;
    const ms=$("#msum");ms.classList.add("on");document.body.classList.add("com-msum");
    ms.innerHTML=`<span><small>Custo receita</small><b>${brl(r.custoReceita)}</b></span><span><small>Porção</small><b>${brl(r.porcao)}</b></span><span><small>${p?"Lucro":"Sugerido"}</small><b>${p?pct(r.pLucro):brl(r.sugerido)}</b></span>`;
    ms.onclick=()=>$("#sum",el).scrollIntoView({behavior:"smooth",block:"start"});
    const setPreco=v=>{f.preco=v;$("#ff_preco",el).value=v?nf(v,2):"";save("fichas");drawIng()};
    const undo=()=>{if(f.precoAnterior==null)return;const v=f.precoAnterior;delete f.precoAnterior;setPreco(v);toast("Preço anterior restaurado: "+(v?brl(v):"sem preço"))};
    const us=$("#useSug",el);if(us)us.onclick=()=>{const antes=+f.preco||0;if(f.precoAnterior==null)f.precoAnterior=antes;setPreco(Math.ceil(r.sugerido*10)/10);
      toast(`Preço alterado de ${antes?brl(antes):"sem preço"} para ${brl(f.preco)}.`,8000,{label:"Desfazer",fn:undo})};
    const ud=$("#undoSug",el);if(ud)ud.onclick=undo;
  };
  drawIng();
  el.querySelector(".form").addEventListener("change",e=>{
    const t=e.target,kk=t.dataset.k;if(!kk)return;
    f[kk]=(kk==="nome"||kk==="cat"||kk==="preparo")?t.value.trim():pnum(t.value);
    if(kk==="porcoes"&&!f.porcoes)f.porcoes=1;
    if(kk==="preco")delete f.precoAnterior;
    save("fichas");if(kk==="nome")$("h1",el).textContent=f.nome;drawIng();
  });
  ing.addEventListener("change",e=>{const t=e.target,tr=t.closest("tr");if(!tr)return;const it=f.itens[+tr.dataset.ix];
    it[t.dataset.k]=t.dataset.k==="un"?t.value:pnum(t.value);save("fichas");drawIng()});
  ing.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const ix=+b.closest("tr").dataset.ix,it=f.itens[ix];
    if(b.dataset.a==="rm"){f.itens.splice(ix,1);save("fichas");drawIng()}
    else if(b.dataset.a==="ins")editarInsumo(insById(it.ref),()=>drawIng());
    else if(b.dataset.a==="sub")go("ficha",it.ref)});
  const add=()=>{const v=$("#newref",el).value;const ref=parseRef(v);
    if(ref==null){toast("Ingrediente não encontrado. Cadastre como insumo novo.");return}
    if(ref===f.cod){toast("Uma ficha não pode conter ela mesma.");return}
    f.itens.push({ref,qtd:0,un:unitsFor(ref)[0]});save("fichas");$("#newref",el).value="";drawIng();
    const inputs=ing.querySelectorAll('input[data-k="qtd"]');inputs[inputs.length-1]?.focus();inputs[inputs.length-1]?.select()};
  $("#addIng",el).onclick=add;$("#newref",el).addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();add()}});
  $("#newIns",el).onclick=()=>editarInsumo(null,nd=>{f.itens.push({ref:nd.id,qtd:0,un:unitsFor(nd.id)[0]});save("fichas");$("#refs",el).innerHTML=refOptions();drawIng();renderNav()});
  $("#back",el).onclick=()=>go("fichas");
  $("#verCard",el).onclick=()=>{cardHL=f.cod;cQ="";if(!(+f.preco>0))toast("Esta ficha ainda não tem preço de venda. Digite o preço na linha destacada.",5000);go("cardapio")};
  $("#dup",el).onclick=()=>{const n={...JSON.parse(JSON.stringify(f)),cod:proximoCod(),nome:f.nome+" (cópia)"};S.fichas.push(n);save("fichas");renderNav();go("ficha",n.cod)};
  $("#del",el).onclick=()=>{const u=usosFicha(f.cod);if(u.length){toast("Esta ficha é usada em: "+u.map(x=>x.nome).join(", "));return}
    confirmar(`Excluir a ficha <b>${esc(f.nome)}</b>?`,()=>{S.fichas=S.fichas.filter(x=>x!==f);save("fichas");renderNav();go("fichas")})};
};

/* ================= CARDÁPIO ================= */
let cSort={k:"cat",d:1},cQ="",cardHL=null;
R.cardapio=el=>{
  const k=cfgCalc();
  el.innerHTML=`<div class="head"><div><h1>Cardápio e preços</h1><p>Preparações vendidas com custo, preço, lucro, margem e simulação de vendas. Edite preço e número de vendas direto na tabela.</p></div>
   <div class="tools"><label class="small" for="dtx">Taxa do delivery (%)</label><input class="f" id="dtx" style="width:80px" inputmode="decimal" value="${nf(S.cfg.deliveryTaxa,2)}">
   <input class="f search" id="cq" placeholder="Buscar preparação" value="${esc(cQ)}" aria-label="Buscar preparação">
   <label class="small"><input type="checkbox" id="soPreco" ${cardHL&&!(+fichaByCod(cardHL)?.preco>0)?"":"checked"}> Só com preço</label></div></div>
   <div class="kpis" id="ck"></div><p class="small" id="ocultas" style="margin:-8px 0 12px"></p>
   <div class="tablewrap"><table><thead><tr>
    <th class="sort" data-k="nome">Preparação</th><th class="sort" data-k="cat">Categoria</th><th class="n sort" data-k="porcao">Custo/porção</th><th class="n sort" data-k="custoReceita">Custo receita</th><th class="n">Preço</th><th class="n sort" data-k="sugerido">Sugerido</th><th class="n sort" data-k="pLucro">% Lucro</th><th class="n sort" data-k="pMargem">Margem</th><th class="n sort" data-k="pCusto">% CMV</th><th class="n">Vendas/mês</th><th class="n sort" data-k="fat">Faturamento</th><th class="n sort" data-k="luc">Lucro</th><th class="n">Preço delivery</th></tr></thead><tbody id="tb"></tbody></table></div>`;
  const draw=()=>{
    const so=$("#soPreco",el).checked,T=S.cfg.deliveryTaxa||0;
    const q=norm(cQ);const ocultas=so?S.fichas.filter(f=>!(+f.preco>0)).length:0;
    let rows=S.fichas.filter(f=>(!so||+f.preco>0)&&(!q||norm(f.nome).includes(q)||norm(f.cod).includes(q))).map(f=>{const r=calcFicha(f);const v=+S.cfg.simulador[f.cod]||0;return{f,r,nome:f.nome,cat:f.cat,v,fat:v*r.preco,luc:v*r.lucro,...r}});
    rows.sort((a,b)=>{const va=a[cSort.k],vb=b[cSort.k];return(typeof va==="string"?va.localeCompare(vb,"pt")||a.nome.localeCompare(b.nome,"pt"):(isFinite(va)?va:-1e9)-(isFinite(vb)?vb:-1e9))*cSort.d});
    $("#ocultas",el).innerHTML=ocultas?`<span class="muted">${ocultas} preparação(ões) sem preço de venda não aparecem (receitas base e fichas novas sem preço).</span> <a href="#" id="mostrar">Mostrar todas</a>`:"";
    const ms=$("#mostrar",el);if(ms)ms.onclick=e=>{e.preventDefault();$("#soPreco",el).checked=false;draw()};
    $("#tb",el).innerHTML=rows.map(x=>`<tr data-f="${x.f.cod}" class="${x.f.cod===cardHL?"hl":""}"><td><a href="#" data-open="${x.f.cod}">${esc(x.nome)}</a></td><td class="small">${esc(x.cat)}</td><td class="n">${brl(x.porcao)}</td><td class="n">${brl(x.custoReceita)}</td>
      <td class="n" style="width:105px"><input class="cell" data-k="preco" value="${x.preco?nf(x.preco,2):""}" aria-label="Preço"></td><td class="n muted">${brl(x.sugerido)}</td>
      <td class="n">${x.preco?`<span class="pill ${x.pLucro<0?"bad":x.pLucro<k.L?"warn":"good"}">${pct(x.pLucro)}</span>`:"–"}</td><td class="n">${pct(x.pMargem)}</td><td class="n">${pct(x.pCusto)}</td>
      <td class="n" style="width:90px"><input class="cell" data-k="vendas" value="${x.v||""}" aria-label="Vendas por mês"></td><td class="n">${x.v?brl(x.fat):""}</td><td class="n">${x.v?brl(x.luc):""}</td><td class="n">${x.preco?brl(x.preco*100/(100-T)):""}</td></tr>`).join("");
    const tf=rows.reduce((a,x)=>a+x.fat,0),tl=rows.reduce((a,x)=>a+x.luc,0),m=medias();
    $("#ck",el).innerHTML=`<div class="kpi"><div class="l">Preparações listadas</div><div class="v">${rows.length}</div></div>
      <div class="kpi"><div class="l">Lucro médio</div><div class="v">${pct(m.lucro)}</div><div class="s">meta ${pct(k.L,0)}</div></div>
      <div class="kpi"><div class="l">Faturamento simulado</div><div class="v">${brl(tf)}</div><div class="s">com as vendas/mês informadas</div></div>
      <div class="kpi"><div class="l">Lucro simulado</div><div class="v">${brl(tl)}</div><div class="s">${tf?pct(tl/tf):"–"} do simulado</div></div>`;
  };
  draw();
  if(cardHL){const tr=$(`#tb tr[data-f="${cardHL}"]`,el);if(tr){tr.scrollIntoView({block:"center"});const i=$('input[data-k="preco"]',tr);if(i&&!i.value)i.focus()}cardHL=null}
  $("#cq",el).oninput=e=>{cQ=e.target.value;draw()};
  $("#soPreco",el).onchange=draw;
  $("#dtx",el).onchange=e=>{S.cfg.deliveryTaxa=Math.min(99,pnum(e.target.value));save("cfg");draw()};
  el.querySelectorAll("th.sort").forEach(th=>th.onclick=()=>{cSort={k:th.dataset.k,d:cSort.k===th.dataset.k?-cSort.d:1};draw()});
  $("#tb",el).addEventListener("change",e=>{const t=e.target,f=fichaByCod(t.closest("tr").dataset.f);
    if(t.dataset.k==="preco"){f.preco=pnum(t.value);save("fichas")}else{const v=pnum(t.value);if(v)S.cfg.simulador[f.cod]=v;else delete S.cfg.simulador[f.cod];save("cfg")}
    resetMemo();draw()});
  $("#tb",el).addEventListener("click",e=>{const a=e.target.closest("[data-open]");if(a){e.preventDefault();go("ficha",a.dataset.open)}});
};

/* ================= BEBIDAS ================= */
R.bebidas=el=>{
  const k=cfgCalc();
  el.innerHTML=`<div class="head"><div><h1>Bebidas prontas</h1><p>Bebidas compradas e revendidas (drinks preparados ficam em Fichas técnicas). Custos variáveis de bebidas: ${pct(k.pVarB,2)} · markup ${nf(k.mkB,2)}×.</p></div>
   <div class="tools"><button class="btn ai" id="sugB">Sugerir custos (Tangará da Serra)</button><button class="btn pri" id="addB">Nova bebida</button></div></div>
   <div class="tablewrap"><table><thead><tr><th>Bebida</th><th class="n">Valor pago</th><th class="n">Preço de venda</th><th class="n">Sugerido</th><th class="n">Custos fixos</th><th class="n">C. variáveis</th><th class="n">Lucro</th><th class="n">% Lucro</th><th class="n">Margem</th><th></th></tr></thead><tbody id="tb"></tbody></table></div>`;
  const draw=()=>{$("#tb",el).innerHTML=S.cfg.bebidas.map((b,ix)=>{const fx=b.preco*k.pFix,vr=b.preco*k.pVarB,l=b.preco-(b.custo+fx+vr),mg=b.preco-(b.custo+vr);
    return`<tr data-ix="${ix}"><td style="min-width:220px"><input class="cell l" data-k="nome" value="${esc(b.nome)}" aria-label="Bebida"></td>
    <td class="n" style="width:100px"><input class="cell" data-k="custo" value="${nf(b.custo,2)}" aria-label="Valor pago"></td>
    <td class="n" style="width:100px"><input class="cell" data-k="preco" value="${nf(b.preco,2)}" aria-label="Preço"></td>
    <td class="n muted">${brl(b.custo*k.mkB)}</td><td class="n">${brl(fx)}</td><td class="n">${brl(vr)}</td><td class="n">${brl(l)}</td>
    <td class="n">${b.preco?`<span class="pill ${l<0?"bad":l/b.preco<k.L?"warn":"good"}">${pct(l/b.preco)}</span>`:"–"}</td><td class="n">${b.preco?pct(mg/b.preco):"–"}</td>
    <td><button class="btn sm danger" data-rm="${ix}" aria-label="Remover">✕</button></td></tr>`}).join("")};
  draw();
  $("#tb",el).addEventListener("change",e=>{const t=e.target,b=S.cfg.bebidas[+t.closest("tr").dataset.ix];b[t.dataset.k]=t.dataset.k==="nome"?t.value:pnum(t.value);save("cfg");draw()});
  $("#tb",el).addEventListener("click",e=>{const b=e.target.closest("[data-rm]");if(!b)return;const it=S.cfg.bebidas[+b.dataset.rm];confirmar(`Remover <b>${esc(it.nome)}</b>?`,()=>{S.cfg.bebidas.splice(+b.dataset.rm,1);save("cfg");draw();renderNav()})});
  $("#addB",el).onclick=()=>{S.cfg.bebidas.unshift({nome:"Nova bebida",custo:0,preco:0});save("cfg");draw();renderNav();$("#tb input",el).select()};
  $("#sugB",el).onclick=async()=>{
    if(precisaChaveIA())return;
    const bt=$("#sugB",el);bt.disabled=true;bt.textContent="Consultando…";
    try{const lista=S.cfg.bebidas.slice(0,40).map(b=>({nome:b.nome,qtd:1,un:"un",preco:b.custo}));const out=[];
      for(let i=0;i<lista.length;i+=20)out.push(...await sugerirPrecos(lista.slice(i,i+20)));
      modal(`<h2>Custo de compra sugerido · Tangará da Serra</h2><p class="small muted">${NO_CLAUDE?"Preços pesquisados pelo Claude na internet.":"Estimativas do Claude, sem consulta a sites em tempo real."} Marque o que quer aplicar.</p>
      <div class="tablewrap"><table><thead><tr><th></th><th>Bebida</th><th class="n">Atual</th><th class="n">Sugerido</th><th>Onde</th></tr></thead><tbody>
      ${S.cfg.bebidas.slice(0,40).map((b,ix)=>{const s=out.find(o=>norm(o.nome)===norm(b.nome))||out[ix];const v=s?s.preco_embalagem/(s.qtd_embalagem||1):NaN;
        return`<tr><td>${isFinite(v)?`<input type="checkbox" class="bc" data-ix="${ix}" data-v="${v}" aria-label="Aplicar">`:""}</td><td>${esc(b.nome)}</td><td class="n">${brl(b.custo)}</td><td class="n">${brl(v)}</td><td class="small">${esc(s?.onde_comprar||"")}</td></tr>`}).join("")}</tbody></table></div>
      <div class="actions"><button class="btn" data-close>Fechar</button><button class="btn pri" id="bok">Aplicar marcados</button></div>`,{wide:true,onMount:(m,close)=>{$("#bok",m).onclick=()=>{m.querySelectorAll(".bc:checked").forEach(c=>S.cfg.bebidas[+c.dataset.ix].custo=+(+c.dataset.v).toFixed(2));save("cfg");close();draw()}}});
    }catch(e){toast(e.message)}finally{bt.disabled=false;bt.textContent="Sugerir custos (Tangará da Serra)"}
  };
};

/* ================= CUSTOS ================= */

        </tbody><tfoot><tr><td>Total</td><td class="n">${brl(k.fixos)}</td><td></td></tr></tfoot></table></div></div>
      <div class="grid">
        <div class="card grid"><h3>Custos variáveis (% sobre a venda)</h3>
          <div class="two" style="gap:10px">
          ${[["varRef","Refeições",k.pVarR],["varBeb","Bebidas",k.pVarB]].map(([key,lab,tot])=>`<div><b class="small">${lab} · ${pct(tot,2)}</b><table><tbody>${S.cfg[key].map((v,ix)=>`<tr><td class="small">${esc(v.nome)}</td><td class="n" style="width:80px"><input class="cell" data-var="${key}" data-ix="${ix}" value="${nf(v.valor,2)}" aria-label="${esc(v.nome)}"></td></tr>`).join("")}</tbody></table></div>`).join("")}
          </div>
          <label class="small" for="luc"><b>Lucro desejado (%)</b> <input class="f" id="luc" style="width:90px" inputmode="decimal" value="${nf(k.L*100,2)}"></label>
        </div>
        <div class="card grid"><h3>Faturamento mensal</h3>
          <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px">${meses.map((mm,ix)=>`<label class="small" for="fm${ix}">${mm}<input class="f" id="fm${ix}" data-fat="${ix}" inputmode="decimal" value="${S.cfg.faturamento[ix]?nf(S.cfg.faturamento[ix],2):""}"></label>`).join("")}</div>
        </div>
      </div>
    </div>`;
    el.querySelectorAll("#cf input").forEach(i=>i.onchange=()=>{const c=S.cfg.custosFixos[+i.closest("tr").dataset.ix];c[i.dataset.k]=i.dataset.k==="nome"?i.value:pnum(i.value);save("cfg");draw()});
    el.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{S.cfg.custosFixos.splice(+b.dataset.rm,1);save("cfg");draw()});
    $("#addCF",el).onclick=()=>{S.cfg.custosFixos.push({nome:"Novo custo",valor:0});save("cfg");draw()};
    el.querySelectorAll("[data-var]").forEach(i=>i.onchange=()=>{S.cfg[i.dataset.var][+i.dataset.ix].valor=pnum(i.value);save("cfg");draw()});
    el.querySelectorAll("[data-fat]").forEach(i=>i.onchange=()=>{S.cfg.faturamento[+i.dataset.fat]=pnum(i.value);save("cfg");draw()});
    $("#luc",el).onchange=e=>{S.cfg.lucroDesejado=pnum(e.target.value)/100;save("cfg");draw()};
  };
  draw();
};

/* ================= PRODUÇÃO ================= */
R.producao=el=>{
  const draw=()=>{
    const acc=new Map();let custoTot=0;
    for(const d of S.cfg.demanda){const f=fichaByCod(d.cod);if(!f||!d.qtd)continue;explodir(f,d.qtd*(f.rend/(f.porcoes||1)),acc)}
    const lista=[...acc.values()].sort((a,b)=>a.i.nome.localeCompare(b.i.nome,"pt"));
    lista.forEach(x=>{x.custo=x.q*precoUnit(x.i);custoTot+=x.custo});
    el.innerHTML=`<div class="head"><div><h1>Produção e compras</h1><p>Informe quantas porções vai produzir de cada preparação. O app abre as sub-receitas e soma a lista de compras por insumo (quantidade bruta, já com FC).</p></div>
     <div class="tools"><button class="btn" id="copy">Copiar lista de compras</button><button class="btn danger" id="clr">Limpar</button></div></div>
    <div class="two">
      <div class="card grid"><h3>Plano de produção</h3>
        <datalist id="fl">${S.fichas.map(f=>`<option value="${f.cod} · ${esc(f.nome)}"></option>`).join("")}</datalist>
        <table><thead><tr><th>Preparação</th><th class="n">Porções</th><th class="n">Kg</th><th></th></tr></thead><tbody>
        ${S.cfg.demanda.map((d,ix)=>{const f=fichaByCod(d.cod);return`<tr><td>${f?esc(f.nome):`<span style="color:var(--bad)">${d.cod} não encontrada</span>`}</td><td class="n" style="width:100px"><input class="cell" data-dq="${ix}" value="${d.qtd||""}" aria-label="Porções"></td><td class="n">${f?nf((d.qtd||0)*f.rend/(f.porcoes||1),2):""}</td><td><button class="btn sm danger" data-drm="${ix}" aria-label="Remover">✕</button></td></tr>`}).join("")}
        </tbody></table>
        <div style="display:flex;gap:8px"><input class="f" list="fl" id="nd" placeholder="Adicionar preparação…" aria-label="Adicionar preparação"><button class="btn pri" id="addD">Adicionar</button></div>
      </div>
      <div class="card grid"><div style="display:flex;justify-content:space-between;align-items:baseline"><h3>Lista de compras</h3><b>${brl(custoTot)}</b></div>
        <div class="tablewrap" style="border:0;max-height:600px"><table><thead><tr><th>Insumo</th><th class="n">Quantidade</th><th class="n">Embalagens</th><th class="n">Custo</th></tr></thead><tbody>
        ${lista.map(x=>`<tr title="${esc([...x.de].join(", "))}"><td>${esc(x.i.nome)}</td><td class="n">${nf(x.q,3)} ${x.i.un}</td><td class="n">${x.i.qtd?nf(Math.ceil(x.q/x.i.qtd*100)/100,2):""}</td><td class="n">${brl(x.custo)}</td></tr>`).join("")||`<tr><td colspan="4" class="muted">Adicione preparações ao plano.</td></tr>`}
        </tbody></table></div></div>
    </div>`;
    el.querySelectorAll("[data-dq]").forEach(i=>i.onchange=()=>{S.cfg.demanda[+i.dataset.dq].qtd=pnum(i.value);save("cfg");draw()});
    el.querySelectorAll("[data-drm]").forEach(b=>b.onclick=()=>{S.cfg.demanda.splice(+b.dataset.drm,1);save("cfg");draw()});
    const add=()=>{const r=parseRef($("#nd",el).value);if(typeof r!=="string"){toast("Escolha uma preparação da lista.");return}S.cfg.demanda.push({cod:r,qtd:10});save("cfg");draw()};
    $("#addD",el).onclick=add;$("#nd",el).onkeydown=e=>{if(e.key==="Enter")add()};
    $("#clr",el).onclick=()=>confirmar("Limpar o plano de produção?",()=>{S.cfg.demanda=[];save("cfg");draw()});
    $("#copy",el).onclick=async()=>{const txt="LISTA DE COMPRAS – Salto das Nuvens\n"+lista.map(x=>`${x.i.nome}: ${nf(x.q,3)} ${x.i.un}`).join("\n")+`\nTotal estimado: ${brl(custoTot)}`;
      try{await navigator.clipboard.writeText(txt);toast("Lista copiada.")}catch(e){modal(`<h3>Lista de compras</h3><textarea class="f" rows="14" readonly>${esc(txt)}</textarea><div class="actions"><button class="btn" data-close>Fechar</button></div>`)}};
  };
  draw();
};

/* ================= BUFFET ================= */
R.buffet=el=>{
  const B=S.cfg.buffet;
  const draw=()=>{
    const k=cfgCalc();
    const rows=B.itens.map(it=>{const f=fichaByCod(it.cod);const ckg=f?calcFicha(f).kg:0;const cons=Math.max(0,(it.kg||0)-(it.sobra||0));return{it,f,ckg,custo:ckg*(it.kg||0),cSobra:ckg*(it.sobra||0),cons}});
    const prod=rows.reduce((a,r)=>a+(r.it.kg||0),0),sobra=rows.reduce((a,r)=>a+(r.it.sobra||0),0),cons=rows.reduce((a,r)=>a+r.cons,0);
    const ctot=rows.reduce((a,r)=>a+r.custo,0);
    const ckgMed=cons?rows.reduce((a,r)=>a+r.ckg*r.cons,0)/cons:0;
    const pSobra=prod?sobra/prod:0;
    const sug=ckgMed*k.mkA/(1-pSobra);
    const cpp=B.refeicoes?cons/B.refeicoes:0;
    el.innerHTML=`<div class="head"><div><h1>Buffet por quilo</h1><p>Monte o cardápio do dia com o que foi produzido e o que sobrou. O app calcula o custo médio do quilo servido e o preço sugerido.</p></div></div>
    <div class="kpis">
      <div class="kpi"><div class="l">Custo médio do kg servido</div><div class="v">${brl(ckgMed)}</div></div>
      <div class="kpi"><div class="l">Preço sugerido do kg</div><div class="v">${brl(sug)}</div><div class="s">markup ${nf(k.mkA,2)}× e sobras ${pct(pSobra)}</div></div>
      <div class="kpi"><div class="l">Preço praticado do kg</div><div class="v">${brl(B.precoPraticado)}</div><div class="s">CMV ${B.precoPraticado?pct(ckgMed/(1-pSobra)/B.precoPraticado):"–"}</div></div>
      <div class="kpi"><div class="l">Consumo por pessoa</div><div class="v">${nf(cpp,3)} kg</div><div class="s">${B.refeicoes||0} refeições atendidas</div></div>
      <div class="kpi"><div class="l">Custo da produção</div><div class="v">${brl(ctot)}</div><div class="s">${nf(prod,2)} kg produzidos, ${nf(sobra,2)} kg de sobra</div></div>
    </div>
    <div class="card form" style="margin-bottom:14px">
      <label for="bp">Preço praticado do kg (R$)<input class="f" id="bp" data-b="precoPraticado" inputmode="decimal" value="${nf(B.precoPraticado,2)}"></label>
      <label for="br">Refeições atendidas<input class="f" id="br" data-b="refeicoes" inputmode="decimal" value="${B.refeicoes||""}"></label>
      <label for="be">Expectativa de refeições<input class="f" id="be" data-b="expectativa" inputmode="decimal" value="${B.expectativa||""}"></label>
    </div>
    <datalist id="fl">${S.fichas.map(f=>`<option value="${f.cod} · ${esc(f.nome)}"></option>`).join("")}</datalist>
    <div class="tablewrap"><table><thead><tr><th>Preparação</th><th>Categoria</th><th class="n">Custo/kg</th><th class="n">Produzido (kg)</th><th class="n">Sobra (kg)</th><th class="n">Custo total</th><th class="n">Custo das sobras</th><th class="n">Consumo (kg)</th><th class="n">Per capita</th><th class="n">Participação</th><th></th></tr></thead><tbody>
    ${rows.map((r,ix)=>`<tr><td>${r.f?esc(r.f.nome):r.it.cod}</td><td class="small">${esc(r.f?.cat||"")}</td><td class="n">${brl(r.ckg)}</td>
      <td class="n" style="width:100px"><input class="cell" data-bi="${ix}" data-k="kg" value="${nf(r.it.kg,3)}" aria-label="Produzido"></td>
      <td class="n" style="width:100px"><input class="cell" data-bi="${ix}" data-k="sobra" value="${nf(r.it.sobra,3)}" aria-label="Sobra"></td>
      <td class="n">${brl(r.custo)}</td><td class="n">${brl(r.cSobra)}</td><td class="n">${nf(r.cons,3)}</td><td class="n">${B.refeicoes?nf(r.cons/B.refeicoes,3):""}</td><td class="n">${cons?pct(r.cons/cons):""}</td>
      <td><button class="btn sm danger" data-brm="${ix}" aria-label="Remover">✕</button></td></tr>`).join("")||`<tr><td colspan="11" class="muted">Adicione as preparações servidas no buffet.</td></tr>`}
    </tbody></table></div>
    <div style="display:flex;gap:8px;margin-top:10px;max-width:520px"><input class="f" list="fl" id="nb" placeholder="Adicionar preparação ao buffet…" aria-label="Adicionar preparação"><button class="btn pri" id="addB">Adicionar</button></div>`;
    el.querySelectorAll("[data-b]").forEach(i=>i.onchange=()=>{B[i.dataset.b]=pnum(i.value);save("cfg");draw()});
    el.querySelectorAll("[data-bi]").forEach(i=>i.onchange=()=>{B.itens[+i.dataset.bi][i.dataset.k]=pnum(i.value);save("cfg");draw()});
    el.querySelectorAll("[data-brm]").forEach(b=>b.onclick=()=>{B.itens.splice(+b.dataset.brm,1);save("cfg");draw()});
    const add=()=>{const r=parseRef($("#nb",el).value);if(typeof r!=="string"){toast("Escolha uma preparação da lista.");return}B.itens.push({cod:r,kg:1,sobra:0});save("cfg");draw()};
    $("#addB",el).onclick=add;$("#nb",el).onkeydown=e=>{if(e.key==="Enter")add()};
  };
  draw();
};

/* ================= FC ================= */
let fcQ="";
R.fc=el=>{
  el.innerHTML=`<div class="head"><div><h1>Tabela de fator de correção</h1><p>Referência de FC (peso bruto ÷ peso limpo) importada da planilha. Use para preencher o FC dos insumos.</p></div>
   <div class="tools"><input class="f search" id="q" placeholder="Buscar corte ou alimento" value="${esc(fcQ)}" aria-label="Buscar"></div></div>
   <div class="tablewrap"><table><thead><tr><th>Alimento / corte</th><th class="n">FC</th><th class="n">Aproveitamento</th></tr></thead><tbody id="tb"></tbody></table></div>`;
  const draw=()=>{const q=norm(fcQ);$("#tb",el).innerHTML=S.cfg.fcRef.filter(r=>!q||norm(r.nome).includes(q)).map(r=>r.fc==null?`<tr><td colspan="3"><b>${esc(r.nome)}</b></td></tr>`:`<tr><td>${esc(r.nome)}</td><td class="n">${nf(r.fc,2)}</td><td class="n">${pct(1/r.fc,0)}</td></tr>`).join("")};
  draw();$("#q",el).oninput=e=>{fcQ=e.target.value;draw()};
};

/* ================= DADOS ================= */
R.dados=el=>{
  el.innerHTML=`<div class="head"><div><h1>Dados e backup</h1><p>Seus dados ficam salvos ${DB?"na nuvem, no banco deste app":"somente neste navegador"}. Importados da planilha em ${fmtDate(S.cfg.importadoEm)}.</p></div></div>
  <div class="two">
   <div class="card grid"><h3>Exportar</h3><p class="small muted">Baixe uma cópia de segurança ou as tabelas em CSV (abre no Excel).</p>
     <div class="tools"><button class="btn" id="exJ">Backup completo (.json)</button><button class="btn" id="exI">Insumos (.csv)</button><button class="btn" id="exF">Fichas (.csv)</button></div></div>
   <div class="card grid"><h3>Restaurar</h3><p class="small muted">Carregue um backup .json salvo antes, ou volte aos dados originais da planilha (substitui tudo).</p>
     <div class="tools"><label class="btn" for="imJ">Carregar backup…</label><input type="file" id="imJ" accept=".json,application/json" class="hidden">${NO_CLAUDE?"":`<button class="btn danger" id="reset">Reimportar planilha original</button>`}</div></div>
  </div>
  ${NO_CLAUDE?`<div class="card grid" style="margin-top:18px"><h3>Inteligência artificial (Claude)</h3>
    <p class="small muted">Usada em "Descrever produto novo" e "Sugerir preços". Neste computador, ela funciona com uma chave da API do Claude (console.anthropic.com), cobrada por uso. A chave fica guardada só aqui.</p>
    <p class="small"><b>Situação:</b> ${apiKey()?`<span class="pill good">Ativada</span> chave terminando em …${esc(apiKey().slice(-4))}`:`<span class="pill warn">Desativada</span>`}</p>
    <div class="tools"><button class="btn pri" id="akSet">${apiKey()?"Trocar chave":"Ativar com minha chave"}</button>${apiKey()?`<button class="btn" id="akTest">Testar</button><button class="btn danger" id="akDel">Remover chave</button>`:""}</div></div>`:""}`;
  if($("#akSet",el))$("#akSet",el).onclick=()=>{try{localStorage.removeItem("cmv_apikey")}catch(e){}precisaChaveIA();const t=setInterval(()=>{if(!$("#modalRoot").innerHTML){clearInterval(t);render()}},400)};
  if($("#akDel",el))$("#akDel",el).onclick=()=>confirmar("Remover a chave da IA deste computador?",()=>{try{localStorage.removeItem("cmv_apikey")}catch(e){}render()});
  if($("#akTest",el))$("#akTest",el).onclick=async()=>{const b=$("#akTest",el);b.disabled=true;b.textContent="Testando…";
    try{const t=await chamarClaude("Responda só: ok");toast(/ok/i.test(t)?"A IA respondeu. Está tudo certo.":"A IA respondeu: "+t.slice(0,60))}catch(e){toast(msgErroIA(e),6000)}finally{b.disabled=false;b.textContent="Testar"}};
  const dl=async(filename,data)=>{if(NO_CLAUDE){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"application/octet-stream"}));a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);return}
    let d=null;try{d=await claude.use("downloads")}catch(e){}
    if(d){try{await d.save({filename,data});return}catch(e){if(e&&e.code==="declined")return}}
    modal(`<h3>${esc(filename)}</h3><p class="small muted">Copie o conteúdo abaixo e salve num arquivo.</p><textarea class="f" rows="14" readonly>${esc(data)}</textarea><div class="actions"><button class="btn" data-close>Fechar</button></div>`)};
  const csv=rows=>"﻿"+rows.map(r=>r.map(v=>{v=typeof v==="number"?String(v).replace(".",","):String(v??"");return/[;"\n]/.test(v)?`"${v.replace(/"/g,'""')}"`:v}).join(";")).join("\n");
  $("#exJ",el).onclick=()=>dl(`cmv-salto-backup-${today()}.json`,JSON.stringify(S));
  $("#exI",el).onclick=()=>dl(`insumos-${today()}.csv`,csv([["Código","Insumo","Valor pago","Embalagem","Unidade","FC","R$ por unidade","R$ com FC","Atualizado"],...S.insumos.map(i=>[i.id,i.nome,i.preco,i.qtd,i.un,i.fc,+precoUnit(i).toFixed(4),+precoComFC(i).toFixed(4),i.atualizado||""])]));
  $("#exF",el).onclick=()=>{resetMemo();dl(`fichas-${today()}.csv`,csv([["Código","Preparação","Categoria","Rendimento kg","Porções","Perdas %","Custo receita","Custo porção","Custo kg","Preço","% Lucro","% CMV"],...S.fichas.map(f=>{const r=calcFicha(f);return[f.cod,f.nome,f.cat,f.rend,f.porcoes,f.perdas,+r.custoReceita.toFixed(2),+r.porcao.toFixed(2),+r.kg.toFixed(2),f.preco,isFinite(r.pLucro)?+(r.pLucro*100).toFixed(1):"",isFinite(r.pCusto)?+(r.pCusto*100).toFixed(1):""]})]))};
  $("#imJ",el).onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const d=JSON.parse(await file.text());if(!d.insumos||!d.fichas||!d.cfg)throw 0;
    confirmar("Substituir todos os dados pelo backup?",()=>{S=d;normalizeCfg();["insumos","fichas","cfg"].forEach(save);renderNav();render();toast("Backup restaurado.")})}catch(x){toast("Arquivo de backup inválido.")}};
  if($("#reset",el))$("#reset",el).onclick=()=>confirmar("Voltar aos dados originais da planilha? Tudo o que foi alterado no app será substituído.",async()=>{await importarPlanilha(false);normalizeCfg();renderNav();render();toast("Dados da planilha reimportados.")});
};

/* ================= login e início ================= */
async function sha256(t){try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}catch(e){return null}}
async function start(){
  $("#login").classList.add("hidden");$("#app").classList.remove("hidden");
  $("#main").innerHTML=`<p class="muted">${NO_CLAUDE&&!lsGet("cmv_insumos")?"Abrindo seus dados pela primeira vez…":"Carregando dados…"}</p>`;
  try{await loadAll()}
  catch(e){console.error(e);$("#main").innerHTML=`<div class="card grid" style="max-width:560px"><h2>Não consegui carregar os dados</h2><p class="muted small">${esc(e&&e.message||e)}</p><div><button class="btn pri" id="retry">Tentar de novo</button></div></div>`;$("#retry").onclick=()=>location.reload();return}
  const h=(location.hash||"").slice(1);if(VIEWS.some(v=>v[0]===h))view=h;
  renderNav();render();
  window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(VIEWS.some(v=>v[0]===h)&&h!==view){view=h;renderNav();render()}});
}
$("#loginForm").addEventListener("submit",async e=>{
  e.preventDefault();
  const u="saltodasnuvens",p=$("#lp").value;
  const h=await sha256(u+":"+p);
  if(!h){$("#lerr").textContent="Este navegador não permite verificar a senha. Abra o app pelo link do claude.ai.";return}
  if(h!==LOGIN_HASH){$("#lerr").textContent="Senha incorreta.";return}
  try{sessionStorage.setItem("cmv_auth","1")}catch(x){}
  SENHA=p;start();
});
let authed=false;try{authed=sessionStorage.getItem("cmv_auth")==="1"}catch(e){}
if(authed&&NO_CLAUDE&&!lsGet("cmv_insumos"))authed=false;
if(authed)start();
</script>
